[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-diffusion"
version = "0.1.0"
description = "Trustworthy physiology- and context-conditioned diffusion modelling for surface EMG"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.9",
    "numpy>=2.0",
    "scipy>=1.14",
]

[project.scripts]
audit-ninapro-db2 = "emg_diffusion.data.audit:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
